# Local infrastructure: `docker compose up -d`
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: spotifood
      POSTGRES_PASSWORD: spotifood
      POSTGRES_DB: spotifood_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotifood"]
      interval: 5s
      retries: 10

  # S3-compatible storage (STORAGE_DRIVER=s3, S3_ENDPOINT=http://localhost:9000)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: spotifood
      MINIO_ROOT_PASSWORD: spotifood-secret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data

  # Catches every outgoing email (EMAIL_PROVIDER=smtp, SMTP_URL=smtp://localhost:1025) → http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  miniodata:
