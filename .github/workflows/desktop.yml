name: Desktop app (Windows + macOS)

# Builds the Spotifood desktop installers and publishes them as a GitHub release.
# Run it from the Actions tab (it uses the version in desktop/package.json), or push a tag
# desktop-v1.2.3. The settings page links to the latest release.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # Unsigned for now (no certificate): the first launch asks to confirm (see docs/DESKTOP.md).
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          # latest.yml: what the installed apps read to update themselves (Windows) or to say a new
          # version exists (macOS).
          path: |
            desktop/dist/Spotifood-Setup.exe
            desktop/dist/Spotifood-mac.dmg
            desktop/dist/latest.yml
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          tag="desktop-v${version}"
          ls -la out
          for f in Spotifood-Setup.exe Spotifood-mac.dmg latest.yml; do
            test -f "out/$f" || { echo "missing $f"; exit 1; }
          done
          # The update file must describe this very installer, or every PC would refuse the download.
          grep -q "^version: ${version}$" out/latest.yml || { echo "latest.yml is not ${version}"; cat out/latest.yml; exit 1; }
          files="out/Spotifood-Setup.exe out/Spotifood-mac.dmg out/latest.yml"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files \
              --title "Spotifood Desktop ${version}" --latest \
              --notes "Windows: Spotifood-Setup.exe · macOS (Intel + Apple Silicon): Spotifood-mac.dmg. Les PC en 1.1.0 ou plus se mettent à jour d'eux-mêmes."
          fi
