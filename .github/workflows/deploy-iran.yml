name: Deploy — Iran (Liara)

# Manual on purpose: production deploys are a decision, not a side effect of a push.
# Requires the repository secret LIARA_API_TOKEN (Liara panel → API → token).
on:
  workflow_dispatch:

concurrency:
  group: deploy-iran
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: iran-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Liara
        run: npx --yes @liara/cli@9 deploy --liara-json deploy/iran/liara.json --api-token "$LIARA_API_TOKEN" --detach
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
