name: Deploy — Iran (Liara, iran/)

# Manual on purpose: production deploys are a decision, not a side effect of a push.
# Requires the repository secret LIARA_API_TOKEN (Liara panel → API → token).
on:
  workflow_dispatch:

concurrency:
  group: deploy-iran
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: iran-production
    defaults:
      run:
        working-directory: iran
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Liara
        # --detach: without a container health check the CLI otherwise keeps waiting after the
        # release is live (until the job times out). The next step shows the start-up logs.
        run: npx --yes @liara/cli@9 deploy --api-token "$LIARA_API_TOKEN" --detach
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
      # Container start-up output (migrations, seed, server), even when the release is rejected.
      - name: Liara app logs
        if: always()
        run: sleep 150 && timeout 90 npx --yes @liara/cli@9 logs --app spotifood --since "15 minutes ago" --timestamps --api-token "$LIARA_API_TOKEN" || true
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
