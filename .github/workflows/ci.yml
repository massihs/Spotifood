name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spotifood
          POSTGRES_PASSWORD: spotifood
          POSTGRES_DB: spotifood_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spotifood"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_SECRET: ci-only-secret-value-that-is-long-enough-123456
      DATABASE_URL: postgres://spotifood:spotifood@localhost:5432/spotifood_test
      TEST_DATABASE_URL: postgres://spotifood:spotifood@localhost:5432/spotifood_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Build (global edition)
        run: npm run build
        env:
          NEXT_PUBLIC_EDITION: global

  # The Iran edition is a separate build (different locales and default language).
  build-iran:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_SECRET: ci-only-secret-value-that-is-long-enough-123456
      DATABASE_URL: postgres://build:build@127.0.0.1:1/build
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_EDITION: iran
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        edition: [global, iran]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (${{ matrix.edition }})
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: NEXT_PUBLIC_EDITION=${{ matrix.edition }}
          cache-from: type=gha,scope=${{ matrix.edition }}
          cache-to: type=gha,mode=max,scope=${{ matrix.edition }}
