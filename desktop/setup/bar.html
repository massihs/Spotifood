<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'" />
<link rel="stylesheet" href="/app.css" />
<style>
  html, body { background: var(--ink); color: #fff; height: 100vh; overflow: hidden; user-select: none; }
  .bar { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px; font-size: 13px; border-bottom: 1px solid #25242b; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 900; font-size: 14px; white-space: nowrap; min-width: 0; }
  .brand img { width: 28px; height: 28px; border-radius: 9px; }
  .brand span { overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 999px; font-weight: 800; white-space: nowrap; font-size: 12.5px; }
  .pill.on { background: rgb(21 146 74 / 0.2); color: #74e3a2; }
  .pill.off { background: var(--danger); color: #fff; }
  .pill b { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px rgb(116 227 162 / 0.18); }
  .pill.off b { animation: pulse 1.2s infinite; box-shadow: none; }
  .msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #b9b6c0; }
  .msg.toast { color: #ffd29a; font-weight: 800; }
  .phones { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: #d6d3dc; background: #1f1e24; height: 30px; padding: 0 12px; border-radius: 999px; }
  .phones .code { font-weight: 900; color: #fff; letter-spacing: 0.12em; font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; background: #1f1e24; border-radius: 999px; padding: 3px; gap: 2px; }
  .b { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 13px; border-radius: 999px; border: 0; background: transparent; color: #c9c6cf; font-weight: 800; font-size: 13px; white-space: nowrap; }
  .b .ic { font-size: 15px; }
  .b:hover { color: #fff; }
  .seg .b[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .b.solo { background: #1f1e24; }
  .b.round { width: 34px; height: 34px; padding: 0; justify-content: center; background: #1f1e24; }
  .b.round[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .b.accent { background: var(--gradient); color: #fff; }
  /* The new version, proposed right under the bar. */
  .banner { display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 16px; background: linear-gradient(90deg, #2a1608, #1b1210 60%, var(--ink)); border-bottom: 1px solid #3a2414; animation: rise 0.25s ease-out; }
  .banner .spark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--gradient); font-size: 19px; flex-shrink: 0; box-shadow: 0 6px 18px -6px rgb(240 106 12 / 0.8); }
  .banner .txt { flex: 1; min-width: 0; line-height: 1.35; }
  .banner .txt b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .banner .txt span { display: block; font-size: 12.5px; color: #c9b9ad; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .banner .go { height: 38px; padding: 0 18px; border-radius: 999px; border: 0; background: #fff; color: var(--ink); font-weight: 900; font-size: 13.5px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .banner .later { height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #d8cdc5; font-weight: 800; font-size: 13px; white-space: nowrap; }
  .banner .later:hover { color: #fff; }
  @media (max-width: 760px) { .wide { display: none !important; } .brand span { max-width: 120px; } }
</style>
</head>
<body>
<div class="bar">
  <span class="brand"><img src="/brand/mark.svg" alt="" /><span id="name">Spotifood</span></span>
  <span id="pill" class="pill on"><b></b><span id="pillText"></span></span>
  <span id="msg" class="msg"></span>
  <span id="phones" class="phones wide hidden"></span>
  <span class="seg" id="views">
    <button class="b" id="site"></button>
    <button class="b" id="local"></button>
  </span>
  <button class="b solo wide hidden" id="sync"></button>
  <button class="b accent hidden" id="update"></button>
  <button class="b round" id="settings"></button>
</div>
<div class="banner hidden" id="banner">
  <span class="spark" id="spark"></span>
  <span class="txt"><b id="bannerTitle"></b><span id="bannerBody"></span></span>
  <button class="later" id="later"></button>
  <button class="go" id="go"></button>
</div>
<script type="module" src="./bar.js"></script>
</body>
</html>
