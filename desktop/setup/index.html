<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:" />
<title>Spotifood</title>
<link rel="stylesheet" href="/app.css" />
<style>
  body { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
  .side { position: relative; overflow: hidden; background: var(--ink); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
  .side::before { content: ""; position: absolute; inset: -30% -20% auto auto; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgb(240 106 12 / 0.55), transparent 65%); filter: blur(10px); }
  .side::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgb(255 255 255 / 0.08) 1px, transparent 1px); background-size: 18px 18px; mask-image: linear-gradient(to bottom, black, transparent 70%); }
  .side > * { position: relative; z-index: 1; }
  .mark { width: 64px; height: 64px; border-radius: 20px; box-shadow: 0 18px 40px -12px rgb(240 106 12 / 0.7); }
  .side h1 { font-size: 34px; line-height: 1.2; margin: 26px 0 12px; font-weight: 900; letter-spacing: -0.01em; }
  .side p { color: #c9c6cf; line-height: 1.8; margin: 0; max-width: 460px; }
  .feats { display: grid; gap: 12px; }
  .feat { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 18px; background: rgb(255 255 255 / 0.05); border: 1px solid rgb(255 255 255 / 0.08); backdrop-filter: blur(6px); }
  .feat .ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: rgb(240 106 12 / 0.16); color: #ffb37a; font-size: 20px; flex-shrink: 0; }
  .feat b { display: block; font-size: 14.5px; }
  .feat span { display: block; font-size: 12.5px; color: #a8a4b0; }
  .main { display: grid; place-items: center; padding: 32px; }
  .box { width: min(440px, 100%); padding: 36px; display: grid; gap: 4px; }
  .box h2 { margin: 0 0 6px; font-size: 24px; font-weight: 900; }
  label { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; margin: 22px 0 8px; }
  label .ic { color: var(--accent); }
  .err { color: var(--danger); font-size: 14px; min-height: 22px; margin-top: 6px; font-weight: 700; }
  .foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12.5px; }
  @media (max-width: 860px) { body { grid-template-columns: 1fr; } .side { padding: 28px; } .side h1 { font-size: 26px; } .feats { display: none; } }
</style>
</head>
<body>
<aside class="side">
  <div>
    <img class="mark" src="/brand/mark.svg" alt="" />
    <h1 id="title"></h1>
    <p id="body"></p>
  </div>
  <div class="feats" id="feats"></div>
</aside>
<div class="main">
  <main class="card box">
    <h2 id="formTitle"></h2>
    <p class="muted" id="hint" style="margin: 0; font-size: 14px; line-height: 1.7"></p>
    <label for="server" id="serverLabel"></label>
    <input id="server" class="field" dir="ltr" spellcheck="false" />
    <div class="err" id="err"></div>
    <button id="go" class="btn primary lg" style="width: 100%"></button>
    <div class="foot muted"><span id="version"></span><span id="secure"></span></div>
  </main>
</div>
<script type="module" src="./index.js"></script>
</body>
</html>
